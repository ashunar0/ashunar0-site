name: Deploy

# 静的サイトなので、ビルドし直さない限り公開日を迎えた記事は出てこない。
# 毎日 1 回ビルドすることで、pubDate が今日になった記事が掘り起こされる。
#
# 定時ビルドの発火は Cloudflare の Cron Trigger に移した
# （workers/scheduled-deploy）。09:05 JST に workflow_dispatch で叩かれる。
# GitHub の schedule は公式に「毎時 00 分は高負荷帯で遅延し、負荷次第では
# drop される」とされていて、実際に 1 時間超の遅延と不発が起きたため。
on:
  schedule:
    # CF が落ちていた場合の保険。こちらが本命だった頃の名残でもある。
    # 遅れて発火しても concurrency で直列化されるだけなので害はない。
    - cron: '0 0 * * *'
  push:
    branches: [main]
  # 待たずに今すぐ反映したい時は Actions タブから手で叩く。
  workflow_dispatch:

# 定時ビルドと push が重なった時に、古い方が後から上書きするのを防ぐ。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 型チェック（astro check）は入れていない。型エラーで公開が止まると
      # 予約公開の意味が無くなるため、check はローカルの deploy スクリプト側に残す。
      - run: pnpm run build

      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
